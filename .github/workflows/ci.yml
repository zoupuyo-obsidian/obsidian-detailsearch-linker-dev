name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20, 22]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run full check
        run: npm run check
      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: detailsearch-linker-node${{ matrix.node-version }}-${{ matrix.os }}-${{ github.sha }}
          path: |
            main.js
            manifest.json
            styles.css
            SHA256SUMS
          if-no-files-found: error
          retention-days: 7
